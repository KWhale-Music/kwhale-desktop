[package]
name = "kwhale-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slint = { version = "1", features = ["unstable-winit-030"] }
anyhow.workspace = true
kwhale-core = { path = "../kwhale-core" }
kwhale-audio = { path = "../kwhale-audio" }
tokio.workspace = true
futures-util.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
ashpd = { version = "0.14", default-features = false, features = ["tokio", "settings"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
serde.workspace = true
serde_json.workspace = true
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
image-webp = "0.2"

[dev-dependencies]
i-slint-backend-testing = "1.19"

[build-dependencies]
slint-build = "1"
