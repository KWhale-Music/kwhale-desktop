[workspace]
resolver = "2"
members = [
    "crates/kwhale-core",
    "crates/kwhale-audio",
    "crates/kwhale-adw",
    "crates/kwhale-qt",
    "crates/kwhale-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["dueattendant149"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "stream", "query"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
zbus = { version = "6.5", default-features = false, features = ["tokio"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
mime_guess = "2"

# Audio
gstreamer = { version = "0.25", features = ["v1_26"] }
gstreamer-app = { version = "0.25", features = ["v1_26"] }
gstreamer-pbutils = { version = "0.25", features = ["v1_26"] }

# GTK4 / Libadwaita
gtk4 = { version = "0.11", features = ["v4_18", "gnome_48"] }
libadwaita = { version = "0.9", features = ["v1_7", "gtk_v4_18"] }

# Qt6 / QML (cxx-qt)
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
