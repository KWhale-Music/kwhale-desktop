id: org.dueattendant149.Kwhale
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kwhale

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.kwhale
  - --own-name=org.mpris.MediaPlayer2.kwhale.*
  - --own-name=org.dueattendant149.Kwhale
  - --filesystem=xdg-music:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/gtk-doc
  - /share/man
  - /share/vala
  - '*.la'
  - '*.a'

modules:
  - name: kwhale
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/kwhale/.cargo
    build-commands:
      - cargo build --offline --release --bin kwhale --bin kwhale-ui -j6
      - install -Dm755 target/release/kwhale /app/bin/kwhale
      - install -Dm755 target/release/kwhale-ui /app/bin/kwhale-ui
      - install -Dm644 packaging/flatpak/org.dueattendant149.Kwhale.desktop /app/share/applications/org.dueattendant149.Kwhale.desktop
      - install -Dm644 packaging/flatpak/org.dueattendant149.Kwhale.metainfo.xml /app/share/metainfo/org.dueattendant149.Kwhale.metainfo.xml
      - install -Dm644 assets/icons/kwhale-64.png /app/share/icons/hicolor/64x64/apps/org.dueattendant149.Kwhale.png
      - install -Dm644 assets/icons/kwhale-128.png /app/share/icons/hicolor/128x128/apps/org.dueattendant149.Kwhale.png
      - install -Dm644 assets/icons/kwhale-256.png /app/share/icons/hicolor/256x256/apps/org.dueattendant149.Kwhale.png
      - install -Dm644 assets/icons/kwhale-512.png /app/share/icons/hicolor/512x512/apps/org.dueattendant149.Kwhale.png
      - install -dm755 /app/share/fonts/kwhale
      - install -Dm644 assets/fonts/*.ttf /app/share/fonts/kwhale/
      - install -dm755 /app/share/kwhale/icons
      - install -Dm644 assets/icons/*.png /app/share/kwhale/icons/
    sources:
      - type: dir
        path: ../../target/flatpak-stage
